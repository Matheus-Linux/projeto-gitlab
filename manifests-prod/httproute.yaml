apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: httproute-api
  namespace: api-prod
spec:
  parentRefs:
    - name: infra-gateway 
      namespace: default
  hostnames:
    - "userapi.mydomain.intra"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
      - name: fastapi-svc
        port: 80