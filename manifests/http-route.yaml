apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: httproute-api
  namespace: api-homolog
spec:
  parentRefs:
    - name: mydomain-gateway
  hostnames:
    - "useradd.mydomain.intra"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
      - name: fastapi-svc
        port: 80